name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows-portable:
    name: Gerar Windows Portable
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Executar testes
        shell: pwsh
        run: gradle --no-daemon clean test

      - name: Gerar imagem portátil
        shell: pwsh
        run: gradle --no-daemon createDistributable

      - name: Preparar imagem portátil
        shell: pwsh
        run: |
          $portable = 'build/compose/binaries/main/app/MonitorDeNoticias'
          if (-not (Test-Path $portable)) { throw "Imagem portátil não encontrada em $portable" }
          New-Item -ItemType Directory -Force -Path "$portable/data/preferences" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portable/data/logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portable/logs" | Out-Null

          # Inclui as DLLs do runtime MSVC ao lado do launcher e no runtime/bin.
          # Isso torna o pacote mais independente de Visual C++ Redistributable externo.
          $crt = @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')
          foreach ($dll in $crt) {
            $source = Join-Path $env:JAVA_HOME "bin/$dll"
            if (Test-Path $source) {
              Copy-Item $source (Join-Path $portable $dll) -Force
              Copy-Item $source (Join-Path $portable "runtime/bin/$dll") -Force
            }
          }

          @'
          Monitor de Notícias 4.0.2 - Windows Portable

          Extraia a pasta inteira e execute MonitorDeNoticias.exe.
          Não mova somente o EXE. As pastas app e runtime são obrigatórias.
          O programa não exige Java instalado externamente.
          '@ | Set-Content -Path "$portable/README.txt" -Encoding UTF8

      - name: Validar runtime portátil
        shell: pwsh
        run: |
          $portable = 'build/compose/binaries/main/app/MonitorDeNoticias'
          $required = @(
            "$portable/MonitorDeNoticias.exe",
            "$portable/app",
            "$portable/runtime",
            "$portable/runtime/bin/jli.dll",
            "$portable/runtime/bin/server/jvm.dll"
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Arquivo obrigatório ausente: $item" }
          }

      - name: Smoke test real do executável portátil
        shell: pwsh
        run: |
          $portable = (Resolve-Path 'build/compose/binaries/main/app/MonitorDeNoticias').Path
          $exe = Join-Path $portable 'MonitorDeNoticias.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WorkingDirectory $portable -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $portable 'data/logs/startup-error.log'
            if (Test-Path $log) { Get-Content $log }
            throw "Smoke test falhou. ExitCode=$($p.ExitCode)"
          }
          $marker = Join-Path $portable 'data/smoke-test-ok.txt'
          if (-not (Test-Path $marker)) { throw 'O processo terminou sem criar o marcador de inicialização.' }
          Remove-Item $marker -Force
          Write-Host 'Smoke test concluído: SQLite, controlador e runtime iniciaram corretamente.'

      - name: Publicar Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: MonitorDeNoticias-Portable-Windows
          path: build/compose/binaries/main/app/MonitorDeNoticias/**
          if-no-files-found: error
          retention-days: 30
