name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Gerar pacote Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Executar testes
        shell: pwsh
        run: gradle --no-daemon clean test

      - name: Gerar distribuição nativa Windows
        shell: pwsh
        run: gradle --no-daemon packageDistributionForCurrentOS

      - name: Listar arquivos gerados
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'build/compose/binaries') {
            Get-ChildItem -Path 'build/compose/binaries' -Recurse -File | Select-Object FullName, Length
          } else {
            Write-Host 'Pasta build/compose/binaries ainda não existe.'
          }

      - name: Publicar executáveis Windows
        uses: actions/upload-artifact@v4
        with:
          name: MonitorDeNoticias-Windows
          path: build/compose/binaries/**
          if-no-files-found: error
          retention-days: 30
v
