name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release, por exemplo v4.0.2'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Compilar e publicar release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Testar e empacotar
        shell: pwsh
        run: |
          gradle --no-daemon clean test
          gradle --no-daemon packageDistributionForCurrentOS

      - name: Criar ZIP dos binários
        id: package
        shell: pwsh
        run: |
          $source = 'build/compose/binaries'
          if (-not (Test-Path $source)) {
            throw "Nenhuma distribuição encontrada em $source"
          }

          $outDir = 'build/release'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zip = Join-Path $outDir 'MonitorDeNoticias-Windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$source/*" -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publicar artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: MonitorDeNoticias-Release-Windows
          path: build/release/MonitorDeNoticias-Windows.zip
          if-no-files-found: error
          retention-days: 90

      - name: Definir tag da release
        id: release_tag
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
          } elseif ('${{ inputs.tag }}') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = "manual-${{ github.run_number }}"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Criar GitHub Release e anexar ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.release_tag.outputs.tag }}'
          $zip = 'build/release/MonitorDeNoticias-Windows.zip'

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "Monitor de Notícias $tag" --generate-notes
          }
